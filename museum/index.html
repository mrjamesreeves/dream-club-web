<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Dream Game</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; overscroll-behavior: none; }
  body { font-family: "Courier New", Courier, monospace; color: #cfd6d3; }
  canvas#view { position: fixed; inset: 0; display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }

  #ui { position: fixed; inset: 0; pointer-events: none; }
  .hidden { display: none !important; }

  #card { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; padding: 0 4vw; opacity: 0; transition: opacity 1.6s; }
  #card span { display: block; font-family: "Times New Roman", Georgia, serif; font-style: italic; font-size: min(15vw, 27vh); letter-spacing: 0.16em; text-indent: 0.16em; text-transform: uppercase; color: #e8eeeb; text-shadow: 0 0 28px rgba(0,0,0,0.95), 0 0 4px #000, 0 2px 0 #000; line-height: 1.0; max-width: 94vw; transform: scale(0.97); transition: transform 7s ease-out, letter-spacing 7s ease-out; }
  #card.on span { transform: scale(1.03); letter-spacing: 0.26em; text-indent: 0.26em; }
  #card.long span { font-size: min(8.4vw, 15vh); letter-spacing: 0.06em; text-indent: 0.06em; line-height: 1.1; }
  #card.long.on span { letter-spacing: 0.16em; text-indent: 0.16em; }
  #chooser { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; background: rgba(5,7,8,0.94); z-index: 2; padding: 4vh 16px; overflow-y: auto; pointer-events: auto; cursor: default; text-align: center; }
  #chooser .head { font-size: 11px; letter-spacing: 0.3em; color: #7a8c8a; margin: auto 0 1.5vh; }
  #chooser ol { list-style: none; margin: 0; padding: 0; text-align: center; counter-reset: dream; }
  #chooser li { counter-increment: dream; font-family: "Times New Roman", Georgia, serif; font-style: italic; text-transform: uppercase; letter-spacing: 0.14em; font-size: min(clamp(14px, 3.2vw, 26px), 4.6vh); color: #c4d2ce; padding: 0.9vh 12px; cursor: pointer; line-height: 1.3; }
  #chooser li::before { content: counter(dream) "  "; font-family: "Courier New", monospace; font-style: normal; font-size: 0.6em; color: #6a7c7a; letter-spacing: 0.1em; }
  #chooser li:hover, #chooser li:active { color: #ffffff; }
  #chooser li.loading { color: #6a7c7a; }
  #chooser .back { margin: 1.5vh 0 auto; font-size: 11px; letter-spacing: 0.25em; color: #7a8c8a; padding: 10px 16px; cursor: pointer; }
  @keyframes blink { to { visibility: hidden; } }

  #dialog {
    position: absolute; left: var(--dlg-left, 50%); bottom: var(--dlg-bottom, 7vh); transform: var(--dlg-transform, translateX(-50%));
    width: var(--dlg-width, min(680px, 86vw)); padding: var(--dlg-padding, 14px 18px 16px);
    background: var(--dlg-bg, rgba(6, 10, 12, 0.82)); border: var(--dlg-border, 2px solid #4d5f62); box-shadow: var(--dlg-shadow, 0 0 0 2px #0b1012, 0 0 0 3px #2a3639);
    border-radius: var(--dlg-radius, 0);
    font-family: var(--dlg-font, "Courier New", Courier, monospace); font-size: var(--dlg-size, 15px); line-height: var(--dlg-leading, 1.5); letter-spacing: var(--dlg-tracking, 0.04em); image-rendering: var(--dlg-pixel, pixelated);
  }
  #dialog .who { font-family: var(--dlg-who-font, inherit); font-size: var(--dlg-who-size, 11px); font-weight: var(--dlg-who-weight, normal); letter-spacing: var(--dlg-who-tracking, 0.3em); text-transform: uppercase; color: var(--dlg-who-color, #8aa3a0); margin-bottom: var(--dlg-who-gap, 6px); }
  #dialog .text { min-height: 3em; color: var(--dlg-color, #d9e2df); white-space: pre-wrap; }
  #dialog.thought { border-color: var(--dlg-thought-border, #4a4560); box-shadow: var(--dlg-thought-shadow, 0 0 0 2px #0b1012, 0 0 0 3px #2a2638); background: var(--dlg-thought-bg, rgba(10, 9, 16, 0.78)); }
  #dialog.thought .text { color: var(--dlg-thought-color, #b4a8d8); font-style: italic; }
  #dialog.thought .more { color: var(--dlg-thought-more, #7a7096); }
  #dialog .more { position: absolute; right: 14px; bottom: 6px; font-size: 11px; color: var(--dlg-more, #6c8280); animation: blink 1.2s steps(2, start) infinite; }

  #prompt { position: absolute; left: 50%; top: 58%; transform: translateX(-50%); font-size: 12px; letter-spacing: 0.25em; color: #c3cfcc; text-shadow: 0 0 6px #000; }
  #hint { position: absolute; left: 50%; top: 4vh; transform: translateX(-50%); font-size: 11px; letter-spacing: 0.25em; color: #7f9593; text-shadow: 0 0 6px #000; transition: opacity 1.5s; }
  #crosshair { position: absolute; left: 50%; top: 50%; width: 3px; height: 3px; margin: -1px 0 0 -1px; background: rgba(220,230,228,0.5); }
  #listen { position: absolute; right: 4vw; top: 36vh; font-size: 11px; letter-spacing: 0.25em; color: #c7b58a; text-shadow: 0 0 6px #000; }
  #veil { position: absolute; inset: 0; background: #ffffff; opacity: 0; pointer-events: none; }
  #reticle { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; transition: opacity 0.18s; will-change: transform; }
  #reticle.on { opacity: 1; }
  #reticle .ring { position: absolute; left: -15px; top: -15px; width: 26px; height: 26px; border: 2px solid #fff; border-radius: 50%; box-shadow: 0 0 3px rgba(0,0,0,0.7), inset 0 0 3px rgba(0,0,0,0.5); }
  #reticle .dot { position: absolute; left: -3px; top: -3px; width: 6px; height: 6px; border-radius: 50%; background: #fff; box-shadow: 0 0 3px rgba(0,0,0,0.7); }
  #reticle.on .ring { animation: lock 0.35s ease-out, breathe 1.8s ease-in-out 0.35s infinite; }
  #reticle.on .dot { animation: dotin 0.35s ease-out; }
  @keyframes lock { from { transform: scale(2.2); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes breathe { 50% { transform: scale(0.8); } }
  @keyframes dotin { from { transform: scale(0); } to { transform: scale(1); } }
  #reticle-text { position: absolute; left: 0; top: 24px; transform: translateX(-50%); white-space: nowrap; font-size: 12px; letter-spacing: 0.22em; color: #fff; text-shadow: 0 0 4px #000, 0 0 8px #000; }
  #titles { position: absolute; inset: 0; background: #ffffff; color: #1a1a1a; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 6vh 16px; overflow-y: auto; pointer-events: auto; z-index: 3; cursor: default; }
  #titles .book { font-family: "Times New Roman", Georgia, serif; font-size: 12px; letter-spacing: 0.5em; text-indent: 0.5em; text-transform: uppercase; color: #8a8a8a; margin: 0 0 4vh; }
  #titles ol { list-style: none; margin: 0; padding: 0; text-align: center; }
  #titles li { font-family: "Times New Roman", Georgia, serif; font-style: italic; font-size: min(clamp(20px, 4.2vw, 32px), 5.5vh); letter-spacing: 0.1em; color: #1a1a1a; padding: 1.3vh 14px; cursor: pointer; transition: color 0.8s; }
  #titles li:hover, #titles li:active { color: #6a6a6a; }
  #titles li.played { color: #c4c4c4; }
  #titles li.loading { color: #a0a0a0; }
  #stall { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #ffffff; color: #5a6462; pointer-events: auto; text-align: center; padding: 0 10vw; font-size: 12px; letter-spacing: 0.15em; }
  #stall .tap { color: #8a9492; }
  @media (orientation: portrait) { #hint { top: 80px !important; max-width: 86vw; text-align: center; line-height: 1.7; } }
  body.touch #hint { top: auto !important; bottom: 25vh; max-width: 86vw; text-align: center; line-height: 1.7; }
  #slot-numbers div { position: absolute; transform: translate(0, 0); font-size: 10px; line-height: 1; color: #d8e0dc; text-shadow: 0 0 3px #000, 0 0 1px #000; pointer-events: none; }
</style>
<canvas id="view"></canvas>
<div id="ui">
  <div id="hint" class="hidden"></div>
  <div id="crosshair" class="hidden"></div>
  <div id="prompt" class="hidden"></div>
  <div id="slot-numbers"></div>
  <div id="reticle"><div class="ring"></div><div class="dot"></div><div id="reticle-text"></div></div>
  <div id="listen" class="hidden"></div>
  <div id="dialog" class="hidden"><div class="who"></div><div class="text"></div><div class="more">&#9660;</div></div>
  <div id="veil"></div>
  <div id="stall" class="hidden"><div class="msg"></div><div class="tap">tap to try again</div></div>
  <div id="card"><span id="card-text"></span></div>
  <div id="titles" class="hidden"><p class="book" id="titles-book"></p><ol id="titles-list"></ol></div>
  <div id="chooser" class="hidden">
    <p class="head">choose a dream</p>
    <ol id="chooser-list"></ol>
    <p class="back" id="chooser-back">back</p>
  </div>
</div>
<script>window.DREAM_VERSION = "69c8391";</script>
<script type="module" src="./src/main.js?v=69c8391"></script>


</body></html>
