<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <title>Watch — Dream Game</title>
  <link rel="icon" href="/img/icon.png">
  <link rel="apple-touch-icon" href="/img/icon.png">

  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/nbb6llm.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&display=swap">

  <style>
    /* A dream, watched rather than played: the experiment. */
    :root {
      --bright: #C2CCBA;
      --muted: #7F847B;
      --serif: "ibm-plex-serif", Georgia, serif;
      --sans: "Source Sans 3", "ibm-plex-sans", -apple-system, sans-serif;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      color: var(--bright);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding: 48px 24px 80px;
    }
    main { max-width: 960px; margin: 0 auto; }
    .eyebrow {
      font-size: 10px;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 12px;
    }
    h1 {
      font-weight: 600;
      font-size: 20px;
      letter-spacing: 3px;
      text-transform: uppercase;
      line-height: 1.3;
      color: #fff;
      margin-bottom: 22px;
    }
    video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 6px;
    }
    .after {
      margin-top: 22px;
      font-family: var(--serif);
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
    }
    .after a { color: var(--bright); text-decoration: none; }
    .after a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .dark { font-family: var(--serif); font-style: italic; color: var(--muted); padding: 40px 0; }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Area X</p>
    <h1 id="title">A dream</h1>
    <div id="player"></div>
    <p class="after" id="after"></p>
  </main>

  <script>
    (function () {
      var m = location.pathname.match(/^\/watch\/([a-z0-9-]+)\/?$/);
      var id = (m && m[1]) || new URLSearchParams(location.search).get('id');
      if (!id) { location.replace('/areax'); return; }

      var holder = document.getElementById('player');
      var v = document.createElement('video');
      v.controls = true; v.playsInline = true; v.preload = 'metadata';
      v.src = '/watch/' + id + '.mp4';
      v.addEventListener('error', function () {
        holder.innerHTML = '<p class="dark">This dream has not been filmed yet.</p>';
      });
      holder.appendChild(v);

      fetch('/play/manifest.json', { cache: 'no-cache' }).then(function (r) { return r.json(); }).then(function (dreams) {
        var i = dreams.findIndex(function (d) { return d.id === id; });
        if (i >= 0) {
          document.title = dreams[i].title + ' — Watch';
          document.getElementById('title').textContent = dreams[i].title;
          document.getElementById('after').innerHTML =
            'Dream ' + (i + 1) + ' of ' + dreams.length + '. '
            + '<a href="/play/' + id + '">Walk into it</a> instead, or go back to <a href="/areax">the twelve</a>.';
        }
      }).catch(function () {});
    })();
  </script>
</body>
</html>
