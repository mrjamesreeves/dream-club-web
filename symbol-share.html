<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Dream Symbols</title>
  <meta name="description" content="Top symbols from a Dream Club journal.">
  <link rel="icon" href="/img/icon.png">

  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/nbb6llm.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">

  <style>
    /* The home page's ink-on-white, at reading size (as privacy). */
    :root {
      --ink: #111;
      --mid: #666;
      --dim: #999;
      --rule: #999;
      --serif: "ibm-plex-serif", Georgia, serif;
      --sans: "Source Sans 3", "ibm-plex-sans", -apple-system, sans-serif;
      --plex-sans: "ibm-plex-sans", -apple-system, sans-serif;
      --display: "richmond-display", "ibm-plex-serif", Georgia, serif;
      --text-serif: "richmond-text", "ibm-plex-serif", Georgia, serif;
      --measure: 560px;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #fff;
      color: var(--ink);
      font-family: var(--sans);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      padding: 72px 24px 96px;
    }
    .wrap { max-width: var(--measure); margin: 0 auto; }
    a { color: inherit; text-decoration: none; }

    /* The masthead, smaller: moon and labels, then the wordmark. */
    .moon-block { display: flex; align-items: center; height: 72px; width: fit-content; }
    .moon-block a { display: block; }
    .moon-block img {
      width: 70px;
      height: 67px;
      margin-left: -7px;
      object-fit: cover;
      filter: invert(1);
      mix-blend-mode: multiply;
    }
    .moon-labels {
      display: flex;
      flex-direction: column;
      margin-left: 13px;
      font-size: 10px;
      font-weight: 500;
      line-height: 1.4;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .moon-name { color: var(--dim); }
    .moon-dreamers { color: var(--ink); min-height: 14px; }
    .moon-dreamers:hover { text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 0.5px; }
    /* The dreamer's title is the page's one header, in the
       wordmark's face; the moon is the way home. */
    h1 {
      font-family: var(--display);
      font-weight: 400;
      font-size: clamp(36px, 5vw, 56px);
      line-height: 1.12;
      color: var(--ink);
      margin: 2px 0 8px;
    }
    .lede {
      font-size: 14px;
      color: var(--mid);
      margin-bottom: 28px;
    }

    .list { padding: 0 0 20px; }
    .row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 7px 0;
    }
    .row .rank {
      font-family: var(--serif);
      font-size: 14px;
      color: var(--dim);
      width: 26px;
      flex: 0 0 auto;
    }
    .row .rank:empty { display: none; }
    .row .name {
      font-family: var(--serif);
      font-size: 20px;
      color: var(--ink);
      text-transform: capitalize;
      white-space: nowrap;
    }
    .row .leader {
      flex: 1;
      border-bottom: 1px dotted rgba(17, 17, 17, 0.3);
      transform: translateY(-5px);
    }
    .row .count {
      font-family: var(--serif);
      font-size: 17px;
      color: var(--mid);
    }

    .group-label {
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--dim);
      padding: 30px 0 6px;
      border-bottom: 0.5px solid var(--rule);
      margin-bottom: 4px;
    }
    .group-label:first-child { padding-top: 6px; }

    .filling {
      font-family: var(--sans);
      font-style: italic;
      font-size: 16px;
      color: var(--mid);
      padding: 40px 0;
    }

    .cta { padding: 34px 0 10px; }
    .cta a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      height: 42px;
      padding: 0 28px;
      background: var(--ink);
      color: #fff;
      border-radius: 5px;
      font-family: var(--plex-sans);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: -0.14px;
      transition: opacity 0.2s ease;
    }
    .cta a:hover { opacity: 0.85; text-decoration: none; }
    .cta .fineprint {
      font-style: italic;
      font-size: 12px;
      line-height: 1.2;
      color: var(--mid);
      max-width: 260px;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <header class="wrap">
    <div class="moon-block">
      <a href="/" aria-label="Dream Club home"><img id="moon-img" src="/img/moons/waxing-gibbous.jpg" alt="" width="70" height="67"></a>
      <span class="moon-labels">
        <span class="moon-name" id="moon-name">Waxing Crescent</span>
        <a class="moon-dreamers" id="moon-dreamers" href="/dream-index" aria-label="The Dream Index">&nbsp;</a>
      </span>
    </div>
    <h1 id="title">Dream Symbols</h1>
    <p class="lede">The most common symbols in one dreamer&rsquo;s journal.</p>
  </header>

  <main class="wrap">
    <div class="list" id="list" aria-live="polite">
      <p class="filling">Consulting the well&hellip;</p>
    </div>
    <div class="cta" id="cta" hidden>
      <a href="/">Join Dream Club</a>
      <p class="fineprint">A private dream journal for iPhone and Mac. Free for 30 days.</p>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://opkalkbjecbnnavxnmdb.supabase.co";
    const KEY = "sb_publishable_2cxTEoh2ZkVcMSb0e9JIDg_CK05bW4f";

    async function rpc(fn, args) {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
        method: "POST",
        headers: {
          apikey: KEY,
          authorization: `Bearer ${KEY}`,
          "content-type": "application/json",
        },
        body: JSON.stringify(args),
      });
      if (!response.ok) throw new Error(`${fn} ${response.status}`);
      return response.json();
    }

    function row(rank, name, count) {
      const div = document.createElement("div");
      div.className = "row";
      div.innerHTML =
        `<span class="rank">${rank}</span>` +
        `<span class="name"></span><span class="leader"></span>` +
        `<span class="count">${count}</span>`;
      div.querySelector(".name").textContent = name;
      return div;
    }

    async function load() {
      const list = document.getElementById("list");
      const slug = location.pathname.split("/").filter(Boolean).pop();
      try {
        const payload = await rpc("symbol_share_get", { p_slug: slug });
        const symbols = Array.isArray(payload?.symbols) ? payload.symbols : [];
        if (!symbols.length) throw new Error("empty");

        if (payload.title) {
          document.getElementById("title").textContent = payload.title;
          document.title = payload.title;
        }
        const top = symbols.slice(0, 10);
        const categorized = top.filter((e) =>
          ["places", "people", "things", "ideas"].includes(e.category));

        if (categorized.length >= top.length / 2) {
          // The codex view: symbols grouped into their four rooms,
          // uncategorized stragglers under "etc."
          const order = ["places", "people", "things", "ideas", "etc"];
          const groups = new Map(order.map((k) => [k, []]));
          for (const entry of top) {
            groups.get(entry.category && groups.has(entry.category) ? entry.category : "etc").push(entry);
          }
          const nodes = [];
          for (const key of order) {
            const members = groups.get(key);
            if (!members.length) continue;
            const label = document.createElement("p");
            label.className = "group-label";
            label.textContent = key;
            nodes.push(label);
            for (const entry of members) nodes.push(row("", entry.symbol, entry.count));
          }
          list.replaceChildren(...nodes);
        } else {
          // Young journal or pre-codex share: the classic ranked list.
          list.replaceChildren(
            ...top.map((entry, index) => row(index + 1, entry.symbol, entry.count))
          );
        }
        document.getElementById("cta").hidden = false;
      } catch {
        list.innerHTML = `<p class="filling">This page has drifted off. The dreamer may have taken it down.</p>`;
      }
    }

    load();
  </script>
  <script src="/js/moon.js"></script>
  <!-- analytics: page views + referrers only, no cookies -->
  <script defer src="https://numbers.jamesreeves.co/numbers.js" data-site="dream"></script>
  <noscript><img src="https://numbers.jamesreeves.co/count.php?s=dream" alt="" width="1" height="1" style="position:absolute"></noscript>
</body>
</html>
