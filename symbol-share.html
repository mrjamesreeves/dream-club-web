<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dream Symbols</title>
  <meta name="description" content="Top symbols from a Dream Club journal.">
  <link rel="icon" href="/img/icon.png">

  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/nbb6llm.css">

  <style>
    :root {
      --bg: linear-gradient(180deg, #000 0%, #222 100%);
      --accent: #8AB7C8;
      --body: #ccc;
      --dim: #999;
      --measure: 520px;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--body);
      font-family: "ibm-plex-sans", -apple-system, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .wrap {
      max-width: calc(var(--measure) + 48px);
      margin: 0 auto;
      padding: 0 24px;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }

    header { text-align: center; padding: 43px 24px 0; }
    .moon-link { display: block; text-decoration: none; }
    .moon-link:hover { text-decoration: none; }
    .moon { width: 72px; height: auto; display: block; margin: 0 auto 8px; }
    .eyebrow.accent { color: var(--accent); }
    .eyebrow {
      font-size: 9px;
      letter-spacing: 1.89px;
      text-transform: uppercase;
      font-weight: 500;
      color: #979797;
    }
    h1 {
      font-family: "playfair-display", Georgia, serif;
      font-weight: 400;
      font-size: clamp(2rem, 6vw, 40px);
      color: #fff;
      margin-top: 10px;
    }
    .lede {
      font-family: "ibm-plex-serif", Georgia, serif;
      font-size: 16px;
      color: var(--dim);
      max-width: 30em;
      margin: 10px auto 0;
    }

    main { padding-top: 34px; padding-bottom: 90px; }
    .list { padding: 0 0 20px; }
    .row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 7px 0;
    }
    .row .rank {
      font-family: "playfair-display", Georgia, serif;
      font-size: 15px;
      color: var(--dim);
      width: 26px;
      flex: 0 0 auto;
    }
    .row .name {
      font-family: "playfair-display", Georgia, serif;
      font-size: 20px;
      color: var(--body);
      text-transform: capitalize;
      white-space: nowrap;
    }
    .row:nth-child(1) .name, .row:nth-child(2) .name, .row:nth-child(3) .name { color: #fff; }
    .row .leader {
      flex: 1;
      border-bottom: 1px dotted rgba(255, 255, 255, 0.25);
      transform: translateY(-4px);
    }
    .row .count {
      font-family: "playfair-display", Georgia, serif;
      font-size: 18px;
      color: var(--dim);
    }

    .filling {
      text-align: center;
      font-family: "ibm-plex-serif", Georgia, serif;
      font-style: italic;
      font-size: 16px;
      color: var(--dim);
      padding: 70px 0;
    }

    .cta {
      text-align: center;
      padding: 34px 0 10px;
    }
    .cta a {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 1.89px;
      text-transform: uppercase;
      font-weight: 500;
      color: #fff;
      border: 1px solid var(--accent);
      border-radius: 999px;
      padding: 11px 26px;
    }
    .cta a:hover { text-decoration: none; background: rgba(138, 183, 200, 0.12); }
    .cta p {
      font-family: "ibm-plex-serif", Georgia, serif;
      font-size: 15px;
      color: var(--dim);
      margin-bottom: 16px;
    }

    footer {
      padding: 80px 24px 60px;
      text-align: center;
      font-size: 13px;
      color: var(--dim);
    }
  </style>
</head>
<body>

  <header>
    <a class="moon-link" href="/" aria-label="Dream Club home">
      <img class="moon" id="moon-img" src="/img/moons/waxing-gibbous.jpg" alt="">
      <p class="eyebrow" id="moon-name">Waxing Gibbous</p>
      <p class="eyebrow accent" id="moon-meta">Week 31 &bull; Day 3</p>
    </a>
    <h1 id="title">Dream Symbols</h1>
  </header>

  <main class="wrap">
    <div class="list" id="list" aria-live="polite">
      <p class="filling">Consulting the well&hellip;</p>
    </div>
    <div class="cta" id="cta" hidden>
      <p>Every dream carries symbols. Start counting yours.</p>
      <a href="/">Join Dream Club</a>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://opkalkbjecbnnavxnmdb.supabase.co";
    const KEY = "sb_publishable_2cxTEoh2ZkVcMSb0e9JIDg_CK05bW4f";

    async function rpc(fn, args) {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
        method: "POST",
        headers: {
          apikey: KEY,
          authorization: `Bearer ${KEY}`,
          "content-type": "application/json",
        },
        body: JSON.stringify(args),
      });
      if (!response.ok) throw new Error(`${fn} ${response.status}`);
      return response.json();
    }

    function row(rank, name, count) {
      const div = document.createElement("div");
      div.className = "row";
      div.innerHTML =
        `<span class="rank">${rank}</span>` +
        `<span class="name"></span><span class="leader"></span>` +
        `<span class="count">${count}</span>`;
      div.querySelector(".name").textContent = name;
      return div;
    }

    async function load() {
      const list = document.getElementById("list");
      const slug = location.pathname.split("/").filter(Boolean).pop();
      try {
        const payload = await rpc("symbol_share_get", { p_slug: slug });
        const symbols = Array.isArray(payload?.symbols) ? payload.symbols : [];
        if (!symbols.length) throw new Error("empty");

        if (payload.title) {
          document.getElementById("title").textContent = payload.title;
          document.title = payload.title;
        }
        list.replaceChildren(
          ...symbols.slice(0, 10).map((entry, index) =>
            row(index + 1, entry.symbol, entry.count))
        );
        document.getElementById("cta").hidden = false;
      } catch {
        list.innerHTML = `<p class="filling">This page has drifted off. The dreamer may have taken it down.</p>`;
      }
    }

    load();
  </script>
  <script src="/js/moon.js"></script>
</body>
</html>
