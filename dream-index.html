<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Dream Index: What the World Is Dreaming About</title>
  <meta name="description" content="Symbols from Dream Club journals around the world.">
  <link rel="icon" href="img/icon.png">

  <link rel="preconnect" href="https://use.typekit.net" crossorigin>
  <link rel="stylesheet" href="https://use.typekit.net/nbb6llm.css">

  <style>
    :root {
      --bg: linear-gradient(180deg, #000 0%, #222 100%);
      --accent: #8AB7C8;
      --teal: #7098A7;
      --body: #ccc;
      --dim: #999;
      --measure: 600px;
    }
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: var(--bg);
      color: var(--body);
      font-family: "ibm-plex-sans", -apple-system, sans-serif;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
    }
    .wrap {
      max-width: calc(var(--measure) + 48px);
      margin: 0 auto;
      padding: 0 24px;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; text-underline-offset: 3px; }

    header { text-align: center; padding: 43px 24px 0; }
    .moon-link { display: block; text-decoration: none; }
    .moon-link:hover { text-decoration: none; }
    .moon {
      width: 72px;
      height: auto;
      display: block;
      margin: 0 auto 8px;
    }
    .eyebrow.accent { color: var(--accent); }
    .eyebrow {
      font-size: 9px;
      letter-spacing: 1.89px;
      text-transform: uppercase;
      font-weight: 500;
      color: #979797;
      padding-bottom: 5px;
    }
    h1 {
      font-family: "playfair-display", Georgia, serif;
      font-weight: 400;
      font-size: clamp(2.2rem, 6vw, 44px);
      color: #fff;
      margin-top: 10px;
    }
    .lede {
      font-family: "ibm-plex-serif", Georgia, serif;
      font-size: 17px;
      color: var(--dim);
      max-width: 34em;
      margin: 10px auto 0;
    }

    .windows {
      display: flex;
      justify-content: center;
      gap: 26px;
      margin: 36px 0 8px;
    }
    .windows button {
      background: none;
      border: 0;
      cursor: pointer;
      font-family: inherit;
      font-size: 9px;
      letter-spacing: 1.89px;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--dim);
      padding: 6px 2px;
      border-bottom: 1px solid transparent;
    }
    .windows button[aria-pressed="true"] {
      color: #fff;
      border-bottom-color: var(--accent);
    }

    .list { padding: 0 0 20px; }
    .row {
      display: flex;
      align-items: baseline;
      gap: 10px;
      padding: 7px 0;
    }
    .row .rank {
      font-family: "playfair-display", Georgia, serif;
      font-size: 15px;
      color: var(--dim);
      width: 26px;
      flex: 0 0 auto;
    }
    .row .name {
      font-family: "playfair-display", Georgia, serif;
      font-size: 20px;
      color: var(--body);
      text-transform: capitalize;
      white-space: nowrap;
    }
    .row:nth-child(1) .name, .row:nth-child(2) .name, .row:nth-child(3) .name { color: #fff; }
    .row .leader {
      flex: 1;
      border-bottom: 1px dotted rgba(255, 255, 255, 0.25);
      transform: translateY(-4px);
    }
    .row .count {
      font-family: "playfair-display", Georgia, serif;
      font-size: 18px;
      color: var(--dim);
    }

    .filling {
      text-align: center;
      font-family: "ibm-plex-serif", Georgia, serif;
      font-style: italic;
      font-size: 16px;
      color: var(--dim);
      padding: 70px 0;
    }

    .global { padding-top: 34px; }
    .global .list { padding-top: 6px; }
    .regions { padding: 30px 0 0; }
    .section-title {
      font-family: "playfair-display", Georgia, serif;
      font-weight: 400;
      font-size: 26px;
      color: var(--accent);
      margin-bottom: 6px;
    }
    .region { margin-top: 26px; }
    .region h3 {
      font-size: 9px;
      letter-spacing: 1.89px;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 4px;
    }

    footer {
      padding: 80px 24px 60px;
      text-align: center;
      font-size: 13px;
      color: var(--dim);
    }
  </style>
</head>
<body>

  <header>
    <a class="moon-link" href="/" aria-label="Dream Club home">
      <img class="moon" id="moon-img" src="/img/moons/waxing-gibbous.jpg" alt="">
      <p class="eyebrow" id="moon-name">Waxing Gibbous</p>
      <p class="eyebrow accent" id="moon-meta">&nbsp;</p>
    </a>
    <h1>The Dream Index</h1>
    <p class="lede">The most common symbols in Dream Club journals around the world.</p>
  </header>

  <nav class="windows wrap" aria-label="Time window" id="windows"></nav>

  <main class="wrap">
    <section class="global">
      <h2 class="section-title" id="global-title" hidden>Global</h2>
      <div class="list" id="list" aria-live="polite"></div>
    </section>
    <section class="regions" id="regions" hidden>
      <h2 class="section-title">By Country</h2>
      <div id="region-list"></div>
    </section>
    <section class="regions" id="states" hidden>
      <h2 class="section-title">By State</h2>
      <div id="state-list"></div>
    </section>
    <section class="regions" id="cities" hidden>
      <h2 class="section-title">By City</h2>
      <div id="city-list"></div>
    </section>
  </main>

  <footer>
    Calculated anonymously. No names, no accounts. <a href="/privacy">How this works &rarr;</a>
  </footer>

  <script>
    const SUPABASE_URL = "https://opkalkbjecbnnavxnmdb.supabase.co";
    const KEY = "sb_publishable_2cxTEoh2ZkVcMSb0e9JIDg_CK05bW4f";

    const COUNTRY_NAMES = new Intl.DisplayNames(["en"], { type: "region" });

    // The Index began in Summer 2026. Windows: all time first, then
    // meteorological seasons newest-first, appearing as they arrive —
    // no file edits when the season turns.
    function seasonWindows() {
      const names = { 11: "Winter", 2: "Spring", 5: "Summer", 8: "Autumn" };
      const windows = [];
      const now = new Date();
      let start = new Date(2026, 5, 1); // Summer 2026, where the well begins
      while (start <= now) {
        const end = new Date(start.getFullYear(), start.getMonth() + 3, 1);
        const name = names[start.getMonth()];
        const label = name === "Winter"
          ? `Winter ${start.getFullYear()}–${String(start.getFullYear() + 1).slice(2)}`
          : `${name} ${start.getFullYear()}`;
        windows.push({ label, from: start.toISOString(), to: end.toISOString() });
        start = end;
      }
      return windows.reverse(); // newest first
    }

    async function rpc(fn, args) {
      const response = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${fn}`, {
        method: "POST",
        headers: {
          apikey: KEY,
          authorization: `Bearer ${KEY}`,
          "content-type": "application/json",
        },
        body: JSON.stringify(args),
      });
      if (!response.ok) throw new Error(`${fn} ${response.status}`);
      return response.json();
    }

    // ISO 3166-2 US codes -> names; other countries show "Code, Country".
    const US_STATES = { AL:"Alabama", AK:"Alaska", AZ:"Arizona", AR:"Arkansas", CA:"California", CO:"Colorado", CT:"Connecticut", DE:"Delaware", FL:"Florida", GA:"Georgia", HI:"Hawaii", ID:"Idaho", IL:"Illinois", IN:"Indiana", IA:"Iowa", KS:"Kansas", KY:"Kentucky", LA:"Louisiana", ME:"Maine", MD:"Maryland", MA:"Massachusetts", MI:"Michigan", MN:"Minnesota", MS:"Mississippi", MO:"Missouri", MT:"Montana", NE:"Nebraska", NV:"Nevada", NH:"New Hampshire", NJ:"New Jersey", NM:"New Mexico", NY:"New York", NC:"North Carolina", ND:"North Dakota", OH:"Ohio", OK:"Oklahoma", OR:"Oregon", PA:"Pennsylvania", RI:"Rhode Island", SC:"South Carolina", SD:"South Dakota", TN:"Tennessee", TX:"Texas", UT:"Utah", VT:"Vermont", VA:"Virginia", WA:"Washington", WV:"West Virginia", WI:"Wisconsin", WY:"Wyoming", DC:"Washington, D.C." };

    const AU_STATES = { NSW:"New South Wales", VIC:"Victoria", QLD:"Queensland", SA:"South Australia", WA:"Western Australia", TAS:"Tasmania", NT:"Northern Territory", ACT:"Australian Capital Territory" };

    function regionName(country, region) {
      if (country === "US") return US_STATES[region] || region;
      if (country === "AU") return AU_STATES[region] || region;
      return region;
    }

    function regionLabel(country, region) {
      if (country === "US" && US_STATES[region]) return US_STATES[region];
      return `${regionName(country, region)}, ${safeCountryName(country)}`;
    }

    // "Columbus, Ohio" / "Sydney, New South Wales" — the region does
    // the locating, the country only when the region is a mystery.
    function cityLabel(country, region, city) {
      if (region) return `${city}, ${regionName(country, region)}`;
      return `${city}, ${safeCountryName(country)}`;
    }

    function rowHTML(row, index) {
      return `<div class="row"><span class="rank">${index + 1}</span><span class="name">${escapeHTML(row.symbol)}</span><span class="leader"></span><span class="count">${row.occurrences}</span></div>`;
    }

    // Belt and braces with the ingestion blocklist: names never chart.
    const BLOCKED_SYMBOLS = new Set(["james"]);
    const allowed = (rows) => rows.filter((row) => !BLOCKED_SYMBOLS.has(row.symbol));

    async function render(windowSpec) {
      const list = document.getElementById("list");
      const regions = document.getElementById("regions");
      const globalTitle = document.getElementById("global-title");
      const bounds = { from_ts: windowSpec.from ?? null, to_ts: windowSpec.to ?? null };
      try {
        const [top, byCountry, byRegion, byCity] = await Promise.all([
          rpc("symbol_stats", { ...bounds, max_rows: 11 }).then(allowed).then((rows) => rows.slice(0, 10)),
          rpc("symbol_stats_by_country", { ...bounds, max_rows_per_country: 11 }).then(allowed),
          rpc("symbol_stats_by_region", { ...bounds, max_rows_per_region: 11 }).then(allowed),
          rpc("symbol_stats_by_city", { ...bounds, max_rows_per_city: 11 }).then(allowed).catch(() => []),
        ]);

        const states = document.getElementById("states");
        const cities = document.getElementById("cities");
        if (!top.length) {
          globalTitle.hidden = true;
          list.innerHTML = `<p class="filling">The well is still filling. Symbols appear here as dreamers analyze their dreams.</p>`;
          regions.hidden = true;
          states.hidden = true;
          cities.hidden = true;
          return;
        }

        globalTitle.hidden = false;
        list.innerHTML = top.map((row, index) => rowHTML(row, index)).join("");

        const grouped = {};
        for (const row of byCountry) (grouped[row.country] ??= []).push(row);
        const countries = Object.keys(grouped).sort();
        if (countries.length) {
          document.getElementById("region-list").innerHTML = countries
            .map((code) => {
              const rows = grouped[code].slice(0, 10).map((row, index) => rowHTML(row, index)).join("");
              return `<div class="region"><h3>${safeCountryName(code)}</h3>${rows}</div>`;
            })
            .join("");
          regions.hidden = false;
        } else {
          regions.hidden = true;
        }

        const stateGroups = {};
        for (const row of byRegion) {
          (stateGroups[`${row.country}/${row.region}`] ??= []).push(row);
        }
        const stateKeys = Object.keys(stateGroups).sort((a, b) =>
          regionLabel(...a.split("/")).localeCompare(regionLabel(...b.split("/")))
        );
        if (stateKeys.length) {
          document.getElementById("state-list").innerHTML = stateKeys
            .map((key) => {
              const [country, region] = key.split("/");
              const rows = stateGroups[key].slice(0, 10).map((row, index) => rowHTML(row, index)).join("");
              return `<div class="region"><h3>${escapeHTML(regionLabel(country, region))}</h3>${rows}</div>`;
            })
            .join("");
          states.hidden = false;
        } else {
          states.hidden = true;
        }

        const cityGroups = {};
        for (const row of byCity) {
          (cityGroups[`${row.country}/${row.region ?? ""}/${row.city}`] ??= []).push(row);
        }
        const cityKeys = Object.keys(cityGroups).sort((a, b) => {
          const [ca, ra, ta] = a.split("/");
          const [cb, rb, tb] = b.split("/");
          return cityLabel(ca, ra, ta).localeCompare(cityLabel(cb, rb, tb));
        });
        if (cityKeys.length) {
          document.getElementById("city-list").innerHTML = cityKeys
            .map((key) => {
              const [country, region, city] = key.split("/");
              const rows = cityGroups[key].slice(0, 10).map((row, index) => rowHTML(row, index)).join("");
              return `<div class="region"><h3>${escapeHTML(cityLabel(country, region, city))}</h3>${rows}</div>`;
            })
            .join("");
          cities.hidden = false;
        } else {
          cities.hidden = true;
        }
      } catch {
        globalTitle.hidden = true;
        list.innerHTML = `<p class="filling">The well is still filling. Symbols appear here as dreamers analyze their dreams.</p>`;
        regions.hidden = true;
        document.getElementById("states").hidden = true;
        document.getElementById("cities").hidden = true;
      }
    }

    function safeCountryName(code) {
      try { return COUNTRY_NAMES.of(code) || code; } catch { return code; }
    }

    function escapeHTML(text) {
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    // Build the nav: All time, then seasons newest-first.
    const windows = [{ label: "All time", from: null, to: null }, ...seasonWindows()];
    const nav = document.getElementById("windows");
    windows.forEach((spec, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = spec.label;
      button.setAttribute("aria-pressed", String(index === 0));
      button.addEventListener("click", () => {
        nav.querySelectorAll("button").forEach((other) => {
          other.setAttribute("aria-pressed", String(other === button));
        });
        render(spec);
      });
      nav.appendChild(button);
    });
    render(windows[0]);
  </script>
  <script src="/js/moon.js"></script>
</body>
</html>
